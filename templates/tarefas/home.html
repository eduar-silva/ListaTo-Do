<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>  
        <h1>Bem-Vindo {{Nome}}! Aqui estão as suas tarefas</h1>
        <table border="1">
            <thead>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Situação</th>
                <th>Data de Criação</th>
            </thead>
            <tbody>
                {% for tarefa in tarefas %}
                    <tr>
                        <td>{{tarefa.nome}}</td>
                        <td>{{tarefa.descricao}}</td>
                        <td>{% if tarefa.concluido %}Completo{% else %}Incompleto{% endif %}</td>
                        <td>{{tarefa.data_criacao}}</td>
                        <td><a href="{% url 'tarefas:editar' tarefa.id %}">Editar</a></td>
                        <td><a href="{% url 'tarefas:remover' tarefa.id %}">Remover</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{% url 'tarefas:adicionar' %}">Adicionar Tarefas</a>
    </body>
</html>
